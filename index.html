<!DOCTYPE html>
<html lang="zh">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>login practice</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <form id="login-form" class = "login-box">
            <h1>welcome back</h1>
            <label for ="username">username</label>
            <input id="username" type="text" placeholder="please enter username" autofocus>
            <label for ="password">password</label>
            <input id="password" type="password" placeholder="please enter password">
            <button id="show-password-button" type="button">show password</button>
            <button id="login-button" type="submit">login</button>
            <p id="message"></p>
            <p class="switch-page">Don't have and account?<a href="register.html">Register here</a></p>
        </form>
        <script src="login.js"></script>
    </body>
</html>
