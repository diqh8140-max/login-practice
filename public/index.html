<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login Practice</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <form
        id="login-form"
        class="login-box"
    >

        <h1>Welcome Back</h1>


        <label for="username">
            Username
        </label>

        <input
            id="username"
            type="text"
            placeholder="Please enter username"
            autofocus
        >


        <label for="password">
            Password
        </label>

        <input
            id="password"
            type="password"
            placeholder="Please enter password"
        >


        <button
            id="show-password-button"
            type="button"
        >
            show password
        </button>


        <button type="submit">
            Login
        </button>


        <p id="message"></p>


        <p class="switch-page">

            Don't have an account?

            <a href="register.html">
                Register here
            </a>

        </p>

    </form>


    <script src="login.js"></script>

</body>

</html>
